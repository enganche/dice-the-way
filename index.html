<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070c1d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Dice The Way</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- Main menu: Shop / Home (world map) / Collection -->
    <section id="screen-home" class="screen">
      <header class="home-top">
        <div class="profile">
          <span class="profile-dice" id="profile-face"></span>
          <div class="world"><small id="world-label"></small><h1 id="world-name"></h1></div>
        </div>
        <button class="capsule" id="cap-stars" aria-label="Stars"><span class="ico on star" data-icon="star"></span><b id="home-stars">0</b></button>
        <button class="capsule" id="cap-pips" aria-label="Pips"><span class="ico pipc" data-icon="pip"></span><b id="home-pips">0</b><span class="plus" data-icon="plus"></span></button>
        <button class="ring-btn sm" id="home-settings" aria-label="Settings"><span class="ico" data-icon="gear"></span></button>
      </header>

      <div class="tab-page" id="tab-home">
        <div id="map-scroll"><div id="map"></div></div>
        <div class="rail left" id="rail-left"></div>
        <div class="rail right" id="rail-right"></div>
        <div class="level-card" id="level-card"></div>
      </div>
      <div class="tab-page" id="tab-shop" hidden><div class="page-scroll"><div class="page" id="shop"></div></div></div>
      <div class="tab-page" id="tab-meta" hidden><div class="page-scroll"><div class="page" id="collection"></div></div></div>

      <nav class="tabs">
        <button data-tab="shop"><span class="ico" data-icon="cart"></span><span data-i18n="tabShop"></span></button>
        <button data-tab="home" class="active centre"><span class="hub"><span class="ico" data-icon="home"></span></span><span data-i18n="tabHome"></span></button>
        <button data-tab="meta"><span class="ico" data-icon="dice"></span><span data-i18n="tabMeta"></span></button>
      </nav>
    </section>

    <!-- In-game HUD -->
    <section id="screen-game" class="screen" hidden>
      <header class="hud" id="hud">
        <div class="hud-row">
          <button class="ring-btn" id="btn-pause" aria-label="Pause"><span class="ico" data-icon="pause"></span></button>
          <div class="hud-title"><b class="hud-level" id="hud-level"></b><small id="hud-world"></small></div>
          <button class="ring-btn" id="btn-replay" aria-label="Replay"><span class="ico" data-icon="replay"></span></button>
        </div>
        <div class="hud-pill">
          <div class="seg-item moves" id="stat-moves"><b id="moves-left">0</b><span class="label" data-i18n="moves"></span></div>
          <div class="seg-item" id="stat-points"><div class="chips" id="point-chips"></div></div>
          <div class="seg-item compass-wrap">
            <div class="compass" id="compass" aria-label="Top face">
              <span class="c-U"></span><span class="c-L"></span><span class="c-face"></span><span class="c-R"></span><span class="c-D"></span>
            </div>
          </div>
        </div>
      </header>

      <div class="hand" id="hand" hidden></div>

      <footer class="game-foot" id="game-foot">
        <div class="coach" id="coach" hidden>
          <p id="coach-text"></p>
          <button class="link-btn" id="btn-skip" data-i18n="skipTut" hidden></button>
        </div>
        <div class="foot-row">
          <button class="booster" id="btn-undo" aria-label="Undo"><span class="ring"><span class="ico" data-icon="undo"></span></span><span class="count">0</span><small data-i18n="undo"></small></button>
          <p class="status" id="status-text"></p>
          <button class="booster" id="btn-hint" aria-label="Hint"><span class="ring"><span class="ico" data-icon="bulb"></span></span><span class="count">0</span><small data-i18n="hint"></small></button>
        </div>
      </footer>
    </section>

    <canvas id="confetti"></canvas>
    <div id="modal-root" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
