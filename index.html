<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070c1d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Dice The Way</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- Main menu: Shop / Home (level map) / Meta -->
    <section id="screen-home" class="screen">
      <header class="home-top">
        <div class="world">
          <small data-i18n="worldLabel"></small>
          <h1 data-i18n="worldName"></h1>
        </div>
        <div class="badge stars"><span class="ico on" data-icon="star"></span><b id="world-stars">0/90</b></div>
        <div class="badge pips"><span class="ico" data-icon="pip"></span><b id="home-pips">0</b></div>
        <button class="ring-btn" id="home-settings" aria-label="Settings"><span class="ico" data-icon="gear"></span></button>
      </header>

      <div class="tab-page" id="tab-home">
        <div id="map-scroll"><div id="map"></div></div>
        <div class="liveops">
          <button class="side-btn locked" data-soon><span class="ring"><span class="ico" data-icon="gift"></span></span><small data-i18n="daily"></small></button>
          <button class="side-btn locked" data-soon><span class="ring"><span class="ico" data-icon="flag"></span></span><small data-i18n="event"></small></button>
          <button class="side-btn" id="meta-shortcut"><span class="ring"><span class="ico" data-icon="spark"></span></span><small data-i18n="meta"></small></button>
        </div>
        <div class="level-card" id="level-card"></div>
      </div>
      <div class="tab-page soon" id="tab-shop" hidden>
        <div class="soon-card"><span class="ico big" data-icon="cart"></span><h2 data-i18n="comingSoon"></h2><p data-i18n="shopSoon"></p></div>
      </div>
      <div class="tab-page soon" id="tab-meta" hidden>
        <div class="soon-card"><span class="ico big" data-icon="spark"></span><h2 data-i18n="comingSoon"></h2><p data-i18n="metaSoon"></p></div>
      </div>

      <nav class="tabs">
        <button data-tab="shop"><span class="ico" data-icon="cart"></span><span data-i18n="tabShop"></span></button>
        <button data-tab="home" class="active centre"><span class="hub"><span class="ico" data-icon="home"></span></span><span data-i18n="tabHome"></span></button>
        <button data-tab="meta"><span class="ico" data-icon="spark"></span><span data-i18n="tabMeta"></span></button>
      </nav>
    </section>

    <!-- In-game HUD -->
    <section id="screen-game" class="screen" hidden>
      <header class="hud" id="hud">
        <div class="hud-row">
          <button class="ring-btn" id="btn-replay" aria-label="Replay"><span class="ico" data-icon="replay"></span></button>
          <b class="hud-level" id="hud-level"></b>
          <button class="ring-btn" id="btn-settings" aria-label="Settings"><span class="ico" data-icon="gear"></span></button>
        </div>
        <div class="hud-pill">
          <div class="seg-item moves" id="stat-moves"><b id="moves-left">0</b><span class="label" data-i18n="moves"></span></div>
          <div class="seg-item" id="stat-points"><div class="chips" id="point-chips"></div></div>
          <div class="seg-item"><div class="face" id="top-face"></div></div>
        </div>
      </header>
      <footer class="hint-area" id="hint-area">
        <p id="hint-text"></p>
        <button class="link-btn" id="btn-skip" data-i18n="skip" hidden></button>
      </footer>
    </section>

    <canvas id="confetti"></canvas>
    <div id="modal-root" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
